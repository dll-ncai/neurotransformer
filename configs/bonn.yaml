# Bonn University EEG: 3 classes (Normal / Interictal / Ictal).
# Record-level split from configs/splits/bonn_split.json -> 7700 / 1650 / 1650 windows.
# Training hyperparameters follow the paper (Table 2), shared by all datasets.
dataset: bonn
data_root: data/bonn         # output of scripts/preprocess_bonn.py
model: neurotransformer
epochs: 100
batch_size: 32
num_workers: 4

optimizer:
  name: adam
  lr: 1.0e-3
  betas: [0.9, 0.98]
  eps: 1.0e-9

scheduler: null

loss:
  # Weighted cross-entropy with inverse-frequency weights N / (K * count_k), counted on the training split.
  # Add class_counts: [...] to skip counting, or set class_weights: null for an unweighted loss.
  class_weights: balanced
  label_smoothing: 0.0

# Keep the checkpoint with the lowest validation loss; stop after 10 epochs without improvement.
monitor: eval_loss
patience: 10
